  <semantic-search-query-keyword domain='<http://www.cidoc-crm.org/extensions/crmarchaeo/A2_Stratigraphic_Volume_Unit>' query='
    PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
    PREFIX crm: <http://www.cidoc-crm.org/cidoc-crm/>
    PREFIX crmarchaeo: <http://www.cidoc-crm.org/extensions/crmarchaeo/>

    SELECT DISTINCT ?subject
    WHERE {
      ?subject a crmarchaeo:A2_Stratigraphic_Volume_Unit ;
               crmarchaeo:AP5i_was_partially_or_totally_removed_by ?excavation .
      ?excavation crm:P7_took_place_at <[[this]]> .
      {
        ?subject crm:P1_is_identified_by ?identifier .
        ?identifier a crm:E42_Identifier ;
                    crm:P2_has_type <http://www.lynx.com/resource/global-id> ;
                    rdfs:label ?label .
      }
      UNION
      {
        ?subject crm:P67i_is_referred_to_by ?description .
        FILTER(isLiteral(?description))
        BIND(STR(?description) AS ?label)
      }
      UNION
      {
        ?subject crm:P67i_is_referred_to_by ?description .
        ?description a crm:E33_Linguistic_Object ;
                     rdfs:label ?label .
      }
      FILTER REGEX(STR(?label), ?__token__, "i")
    }
  ' default-query='
    PREFIX crm: <http://www.cidoc-crm.org/cidoc-crm/>
    PREFIX crmarchaeo: <http://www.cidoc-crm.org/extensions/crmarchaeo/>

    SELECT DISTINCT ?subject
    WHERE {
      ?subject a crmarchaeo:A2_Stratigraphic_Volume_Unit ;
               crmarchaeo:AP5i_was_partially_or_totally_removed_by ?excavation .
      ?excavation crm:P7_took_place_at <[[this]]> .
    }
  ' debounce=500></semantic-search-query-keyword>

            Showing {{numberOfResults}} of {{totalNumberOfResults}} matches. <strong>Please, refine your search.</strong> </bs-alert>
            {{else}}<span> found {{numberOfResults}} stratigraphic units </span>{{/if}}'>
          </mp-sparql-result-counts>
        </semantic-search-result>

        <semantic-search-result id='map-result-wrapper'>
          <div style='height: 70vh; min-height: 480px;'>
            <semantic-map id='map-result' query='
            PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
            PREFIX crm: <http://www.cidoc-crm.org/cidoc-crm/>
            PREFIX crmarchaeo: <http://www.cidoc-crm.org/extensions/crmarchaeo/>

            SELECT DISTINCT (CONCAT("Point(", STR(?coords), ")") AS ?wkt) ?label ?subject WHERE {
              ?subject a crmarchaeo:A2_Stratigraphic_Volume_Unit ;
                       crm:P1_is_identified_by <http://www.lynx.com/resource/us-number> ;
                       rdfs:label ?usLabel ;
                       crmarchaeo:AP5i_was_partially_or_totally_removed_by ?excavation .
              ?excavation crm:P7_took_place_at ?site .
              FILTER(?site = <[[this]]>)
              ?site crm:P168_place_is_defined_by ?literal .
              ?literal rdfs:label ?coords .
              BIND(CONCAT("US ", STR(?usLabel)) AS ?label)
            }
            ' tuple-template='{{> template }}'>
              <template id='template'>
                <semantic-link iri="{{subject.value}}">{{label.value}}</semantic-link>
              </template>
            </semantic-map>
          </div>
        </semantic-search-result>
      </div>
    </semantic-search-result-holder>
  </div>
</semantic-search>
