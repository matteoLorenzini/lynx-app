name: Deploy ResearchSpace

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set paths
        shell: bash
        run: |
          compose_root="/home/matteo/researchspace-docker-desktop-main"
          runtime_target="${compose_root}/researchspace/runtime-data"

          echo "COMPOSE_ROOT=${compose_root}" >> "$GITHUB_ENV"
          echo "RUNTIME_TARGET=${runtime_target}" >> "$GITHUB_ENV"
          echo "SERVICE_NAME=researchspace" >> "$GITHUB_ENV"

      - name: Sync changed files only
        shell: bash
        run: |
          set -euo pipefail

          target="$RUNTIME_TARGET"

          echo "========================================"
          echo "ResearchSpace deployment"
          echo "Source: $PWD"
          echo "Target: $target"
          echo "========================================"

          if [[ ! -d "$target" ]]; then
            echo "Runtime directory not found: $target" >&2
            exit 1
          fi

          sync_dir() {
            src="$1"
            dst="$2"

            if [[ ! -d "$src" ]]; then
              echo "Skipping missing directory: $src"
              return 0
            fi

            mkdir -p "$dst"

            echo ""
            echo "Syncing directory:"
            echo "  $src"
            echo "  -> $dst"

            if command -v rsync >/dev/null 2>&1; then
              # -r       recursive
              # --update do not overwrite newer files in the target
              # No -t/-a: do not try to preserve timestamps,
              # which can fail on Docker bind-mounted directories.
              rsync -r --update --itemize-changes "$src/" "$dst/"
            else
              cp -ru "$src/." "$dst/"
            fi
          }

          sync_file() {
            src="$1"
            dst="$2"

            if [[ ! -f "$src" ]]; then
              echo "Skipping missing file: $src"
              return 0
            fi

            mkdir -p "$(dirname "$dst")"

            echo ""
            echo "Syncing file:"
            echo "  $src"
            echo "  -> $dst"

            if command -v rsync >/dev/null 2>&1; then
              # Do not preserve timestamps.
              rsync --update --itemize-changes "$src" "$dst"
            elif [[ ! -e "$dst" || "$src" -nt "$dst" ]]; then
              cp -f "$src" "$dst"
            fi
          }

          # Files/directories deployed to ResearchSpace runtime-data.
          sync_file "$PWD/plugin.properties" "$target/plugin.properties"

          sync_dir "$PWD/assets" "$target/assets"
          sync_dir "$PWD/config" "$target/config"
          sync_dir "$PWD/data" "$target/data"
          sync_dir "$PWD/images" "$target/images"
          sync_dir "$PWD/lib" "$target/lib"

          echo ""
          echo "========================================"
          echo "Sync complete"
          echo "Only changed files were updated."
          echo "No files were deleted from the runtime."
          echo "========================================"

      - name: Verify deployment
        shell: bash
        run: |
          set -euo pipefail

          url="http://localhost:10214/"

          echo "Checking ResearchSpace at $url"

          status_code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 "$url" || true)

          if [[ "$status_code" =~ ^[0-9]{3}$ ]] && [[ "$status_code" -lt 500 ]]; then
            echo "Service is responding (HTTP $status_code)"
            echo "Deployment successful - files updated without restart"
          else
            echo "Service is not responding at $url (HTTP ${status_code:-n/a})" >&2
            exit 1
          fi