name: Deploy app to ResearchSpace platform

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync app files to local ResearchSpace app volume
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $composeRoot = "C:\Users\matte\research-space\researchspace-docker-desktop-main"
          $target = Join-Path $composeRoot "researchspace\runtime-data\apps\lynx-app"

          if (!(Test-Path $target)) {
            New-Item -ItemType Directory -Path $target -Force | Out-Null
          }

          robocopy "$env:GITHUB_WORKSPACE" $target /E /XD "$env:GITHUB_WORKSPACE\.git" "$env:GITHUB_WORKSPACE\.github" /R:2 /W:5
          if ($LASTEXITCODE -gt 7) {
            throw "Sync failed with robocopy exit code $LASTEXITCODE"
          }
          $global:LASTEXITCODE = 0

      - name: Restart ResearchSpace container
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $container = "localhost-researchspace-1"

          docker version
          $exists = docker ps -a --format "{{.Names}}" | Select-String -SimpleMatch "^$container$"
          if (-not $exists) {
            throw "Container '$container' not found. Check the hardcoded container name."
          }

          docker restart $container
          if ($LASTEXITCODE -ne 0) {
            throw "docker restart failed with code $LASTEXITCODE"
          }