<semantic-search
  search-profile='{
    "categories": [
      {
        "iri": "<http://www.cidoc-crm.org/cidoc-crm/E53_Place>",
        "label": "Area of investigation",
        "thumbnail": "../assets/images/icons/rs-icons/place.svg"
      },
      {
        "iri": "<http://www.cidoc-crm.org/cidoc-crm/E27_Site>",
        "label": "Site",
        "thumbnail": "../assets/images/icons/rs-icons/place.svg"
      }
    ],
    "relations": [
      {
        "iri": "<http://www.lynx.com/resource/field/contains_site>",
        "label": "Contains Site",
        "hasDomain": "<http://www.cidoc-crm.org/cidoc-crm/E53_Place>",
        "hasRange": "<http://www.cidoc-crm.org/cidoc-crm/E27_Site>"
      }
    ]
  }'
  relations='{
    "<http://www.lynx.com/resource/field/contains_site>": [{
      "kind": "resource",
      "queryPattern": "{$subject a crm:E53_Place ; crm:P2_has_type <http://www.lynx.com/resource/cultural-heritage-place> ; ^crm:P89_falls_within ?__value__ . ?__value__ a crm:E27_Site .}"
    }]
  }'
  >
  <semantic-search-query-keyword domain='<http://www.cidoc-crm.org/cidoc-crm/E53_Place>' query='
    PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
    PREFIX crm: <http://www.cidoc-crm.org/cidoc-crm/>

    SELECT DISTINCT ?subject
    WHERE {
      ?subject a crm:E53_Place ;
               crm:P2_has_type <http://www.lynx.com/resource/cultural-heritage-place> ;
               rdfs:label ?label .
      FILTER REGEX(STR(?label), ?__token__, "i")
    }
  ' default-query='
    PREFIX crm: <http://www.cidoc-crm.org/cidoc-crm/>

    SELECT DISTINCT ?subject
    WHERE {
      ?subject a crm:E53_Place ;
               crm:P2_has_type <http://www.lynx.com/resource/cultural-heritage-place> .
    }
  ' debounce=500></semantic-search-query-keyword>

  <div data-flex-layout="row stretch-stretch">
    <div data-flex-self="size-1of3" style="flex: 0 0 260px; max-height: 80vh; overflow-y: auto;">
      <semantic-search-facet></semantic-search-facet>
    </div>

    <semantic-search-result-holder>
      <div data-flex-self="md-full">
        <semantic-search-result id='map-result-wrapper'>
          <div style='height: 70vh; min-height: 480px;'>
            <semantic-map id='map-result' query='
            PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
            PREFIX crm: <http://www.cidoc-crm.org/cidoc-crm/>

            SELECT DISTINCT (CONCAT("Point(", STR(?coords), ")") AS ?wkt) ?label ?subject WHERE {
              {
                ?subject crm:P168_place_is_defined_by ?literal .
                ?literal rdfs:label ?coords .
              }
              UNION
              {
                ?site crm:P89_falls_within ?subject ;
                      crm:P168_place_is_defined_by ?siteLiteral .
                ?siteLiteral rdfs:label ?coords .
              }
              OPTIONAL { ?subject rdfs:label ?areaLabel }
              BIND(COALESCE(?areaLabel, STR(?subject)) AS ?label)
            }
            ' tuple-template='{{> template }}'>
              <template id='template'>
                <semantic-link iri="http://www.lynx.com/resource/structured-search-site">{{label.value}}</semantic-link>
              </template>
            </semantic-map>
          </div>
        </semantic-search-result>
      </div>
    </semantic-search-result-holder>
  </div>
</semantic-search>
