[[#if (urlParam "details")]]
<div class="details-content">
  <bs-tabs class="details-tabs">
    <bs-tab title='Stratigraphic Unit Description' event-key='us-description-raw' mount-on-enter=true class="rawdata-tab">
      <mp-field-visualization
        subject='[[this]]'
        fields='[[fieldDefinitionsFromQuery (setQueryBindings "SELECT DISTINCT ?field WHERE {?resource ?field ?o . ?field a <http://www.researchspace.org/resource/system/fields/Field> } ORDER BY DESC(?field)" resource=this.iri) ]]'
        template='{{> template}}'>
        <template id="template">{{> rsp:ResourceFieldBasedVisualization subject="[[this]]"}}</template>
      </mp-field-visualization>
    </bs-tab>
  </bs-tabs>
</div>
[[else]]
<with-types fixed-key='resource-[[this]]' iri='[[this]]' template='{{> resource}}' [[> rsp:TypeMappings]]>
  <template id='resource'>
    <div class="rs-resource-container">
      [[#block "resourceHeader"]]
      <div class="rs-resource-header {{getValueByKey entityBgColor allTypes 'rs-entity-bg-thing'}}">
        <div class="rs-resource-header-topContainer">
          <div class="rs-resource-header-topButtons">
            <semantic-link-container uri='[[resolvePrefix "rsp:ThinkingFrames"]]' urlqueryparam-view='knowledge-map' urlqueryparam-resource='[[this]]'>
              <button type="button" title="Author Resource in Knowledge Map">
                <rs-icon icon-type="round" icon-name="account_tree"></rs-icon>
              </button>
            </semantic-link-container>
            <mp-event-trigger id='details-view-trigger' type='Component.TemplateUpdate' data='{"iri": "{{iri}}"}' targets='["details-view", "open-details-sidebar"]'>
              <button type="button" title="Resource Details">
                <rs-icon icon-type="rounded" icon-name="info" symbol="true"></rs-icon>
              </button>
            </mp-event-trigger>
            <mp-has-permission permission="api:ldp:*">
              <semantic-link-container uri='http://www.researchspace.org/resource/ResourceContentEditE18' urlqueryparam-resource='[[this]]'>
                <button type="button" title="Author Resource in Form">
                  <rs-icon icon-type="rounded" icon-name="edit_note" symbol="true"></rs-icon>
                </button>
              </semantic-link-container>
            </mp-has-permission>
          </div>
        </div>

        <div class="rs-resource-header-content-container">
          <div class="rs-resource-header--image-container">
            <semantic-query query='
              PREFIX pico: <http://data.cochrane.org/ontologies/pico/>
              PREFIX arco: <https://w3id.org/arco/ontology/arco/>
              PREFIX rdf:  <http://www.w3.org/1999/02/22-rdf-syntax-ns#>
              PREFIX crm: <http://www.cidoc-crm.org/cidoc-crm/>
              PREFIX crmarchaeo: <http://www.cidoc-crm.org/extensions/crmarchaeo/>
              PREFIX rs: <http://www.researchspace.org/ontology/>

              SELECT DISTINCT ?subject ?document ?preview ?previewIiif
              WHERE {
                BIND(<[[this]]> AS ?subject)
                {
                  ?subject a crmarchaeo:A2_Stratigraphic_Volume_Unit ;
                           crm:P70i_is_documented_in ?document .
                  ?document a crm:E31_Document .
                  OPTIONAL { ?document pico:preview ?preview . }
                }
                UNION
                {
                  ?subject a crmarchaeo:A2_Stratigraphic_Volume_Unit ;
                           crm:P138i_has_representation ?preview .
                }
                OPTIONAL { ?preview rs:PX_has_file_name ?previewFileName . }
                BIND(COALESCE(STR(?previewFileName), IF(REGEX(STR(?preview), "/resource/EX_File/", "i"), REPLACE(STR(?preview), "^.*/EX_File/", ""), ""), "") AS ?previewFileAny)
                BIND(IF(STRLEN(?previewFileAny) > 0, CONCAT("/proxy/IIIF/2/", ENCODE_FOR_URI(?previewFileAny), "/full/!700,700/0/default.jpg"), STR(?preview)) AS ?previewIiif)
              } LIMIT 1' template='{{> headerPreview}}'>
              <template id="headerPreview">
                {{#with bindings.[0]}}
                  {{#if preview.value}}
                    <div class="detail-thumb" style="margin-bottom:8px;">
                      <a href="{{previewIiif.value}}" target="_blank" rel="noopener">
                        <img src="{{previewIiif.value}}" alt="Preview" style="max-width:240px; max-height:160px; object-fit:cover; border-radius:4px; display:block;" />
                      </a>
                    </div>
                  {{/if}}
                {{/with}}
              </template>
            </semantic-query>
          </div>

          <div style="padding: 1.8% 1.5% 1.5% 5%;">
            [[> resourceHeaderData image=true]]
            <div style="margin-top: 8px; height: 200px; width: 100%;">
              <semantic-map
                id='us-site-map-[[this]]'
                query='
                  PREFIX crm: <http://www.cidoc-crm.org/cidoc-crm/>
                  PREFIX crmarchaeo: <http://www.cidoc-crm.org/extensions/crmarchaeo/>
                  PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>

                  SELECT DISTINCT (CONCAT("Point(", STR(?coords), ")") AS ?wkt) ?label ?site WHERE {
                    <[[this]]> crmarchaeo:AP5i_was_partially_or_totally_removed_by ?excavation .
                    ?excavation crm:P7_took_place_at ?site .
                    ?site a crm:E27_Site ;
                          crm:P168_place_is_defined_by ?literal .
                    ?literal rdfs:label ?coords .
                    OPTIONAL { ?site rdfs:label ?siteLabel }
                    BIND(COALESCE(?siteLabel, STR(?site)) AS ?label)
                  }'
                tuple-template='{{> siteMarker}}'>
                <template id='siteMarker'>
                  <semantic-link iri="{{site.value}}">{{label.value}}</semantic-link>
                </template>
              </semantic-map>
            </div>
          </div>
        </div>
      </div>
      [[/block]]

      <!-- Tabs: Expanded to include "Finds / Reperti" -->
      <bs-tab-container id="tab-container" class="rs-resource-tabs" default-active-key="identification">
        <div>
          <bs-nav bs-style="tabs">
            <bs-nav-item event-key="identification">Identification</bs-nav-item>
            <bs-nav-item event-key="us-description">Description</bs-nav-item>
            <bs-nav-item event-key="composition">Components & Measures</bs-nav-item>
            <bs-nav-item event-key="location">Excavation & Location</bs-nav-item>
            <bs-nav-item event-key="periodization">Chronology & Periodization</bs-nav-item>
            <bs-nav-item event-key="relations">Stratigraphic Relations</bs-nav-item>
            <bs-nav-item event-key="finds">Finds (Reperti)</bs-nav-item>
            <bs-nav-item event-key="documentation">Documentation & Responsibility</bs-nav-item>
          </bs-nav>

          <bs-tab-content animation="true">
            <bs-tab-pane event-key="identification">
              <div class="rs-resource-tab-container">
                <div class="rs-resource-data-table">
                  <mp-field-visualization
                    subject='[[this]]'
                    fields='[[fieldDefinitions us_global_id="http://www.lynx-platform.com/field/us_global_id" us_definition="http://www.lynx-platform.com/field/us_definition" us_descrizione="http://www.lynx-platform.com/field/us_descrizione" us_interpretazione="http://www.lynx-platform.com/field/us_interpretazione" us_osservazioni="http://www.lynx-platform.com/field/us_osservazioni" ]]'
                    template='{{> template}}'>
                    <template id="template">{{> rsp:ResourceFieldBasedVisualization subject="[[this]]"}}</template>
                  </mp-field-visualization>
                </div>
              </div>
            </bs-tab-pane>

            <bs-tab-pane event-key="us-description">
              <div class="rs-resource-tab-container">
                <div class="rs-resource-data-table">
                  <mp-field-visualization
                    subject='[[this]]'
                    fields='[[fieldDefinitions us_typology="http://www.lynx-platform.com/field/us_typology" us_formation_mode="http://www.lynx-platform.com/field/us_formation_mode" us_consistency="http://www.lynx-platform.com/field/us_consistency" us_color="http://www.lynx-platform.com/field/us_color" us_distinction_criteria="http://www.lynx-platform.com/field/us_distinction_criteria" us_conservation_state="http://www.lynx-platform.com/field/us_conservation_state" us_stratigraphic_reliability="http://www.lynx-platform.com/field/us_stratigraphic_reliability"]]'
                    template='{{> template}}'>
                    <template id="template">{{> rsp:ResourceFieldBasedVisualization subject="[[this]]"}}</template>
                  </mp-field-visualization>
                </div>
              </div>
            </bs-tab-pane>

            <bs-tab-pane event-key="composition">
              <div class="rs-resource-tab-container">
                <div class="rs-resource-data-table">
                  <mp-field-visualization
                    subject='[[this]]'
                    fields='[[fieldDefinitions us_inorganic_components="http://www.lynx-platform.com/field/us_inorganic_components" us_organic_components="http://www.lynx-platform.com/field/us_organic_components" us_dating_elements="http://www.lynx-platform.com/field/us_dating_elements" us_quote="http://www.lynx-platform.com/field/us_quote" us_measures="http://www.lynx-platform.com/field/us_measures"]]'
                    template='{{> template}}'>
                    <template id="template">{{> rsp:ResourceFieldBasedVisualization subject="[[this]]"}}</template>
                  </mp-field-visualization>
                </div>
              </div>
            </bs-tab-pane>

            <bs-tab-pane event-key="location">
              <div class="rs-resource-tab-container">
                <div class="rs-resource-data-table">
                  <mp-field-visualization
                    subject='[[this]]'
                    fields='[[fieldDefinitions us_excavation_site="http://www.lynx-platform.com/field/us_excavation_site" us_saggio="http://www.lynx-platform.com/field/us_saggio" us_area_struttura="http://www.lynx-platform.com/field/us_area_struttura" us_settore="http://www.lynx-platform.com/field/us_settore" us_quadrato="http://www.lynx-platform.com/field/us_quadrato" us_posizione="http://www.lynx-platform.com/field/us_posizione" us_ambiente_unita_funzionale="http://www.lynx-platform.com/field/us_ambiente_unita_funzionale"]]'
                    template='{{> template}}'>
                    <template id="template">{{> rsp:ResourceFieldBasedVisualization subject="[[this]]"}}</template>
                  </mp-field-visualization>
                </div>
              </div>
            </bs-tab-pane>

            <bs-tab-pane event-key="periodization">
              <div class="rs-resource-tab-container">
                <div class="rs-resource-data-table">
                  <mp-field-visualization
                    subject='[[this]]'
                    fields='[[fieldDefinitions us_period="http://www.lynx-platform.com/field/us_period" us_phase="http://www.lynx-platform.com/field/us_phase" us_activity="http://www.lynx-platform.com/field/us_activity" us_dating="http://www.lynx-platform.com/field/us_dating"]]'
                    template='{{> template}}'>
                    <template id="template">{{> rsp:ResourceFieldBasedVisualization subject="[[this]]"}}</template>
                  </mp-field-visualization>
                </div>
              </div>
            </bs-tab-pane>

            <bs-tab-pane event-key="relations">
              <div class="rs-resource-tab-container">
                <bs-tab-container id="relations-subtabs" class="rs-resource-subtabs" default-active-key="rel-cover">
                  <div>
                    <bs-nav bs-style="pills">
                      <bs-nav-item event-key="rel-cover">Covers / Covered By</bs-nav-item>
                      <bs-nav-item event-key="rel-cut">Cuts / Cut By</bs-nav-item>
                      <bs-nav-item event-key="rel-fill">Fills / Filled By</bs-nav-item>
                      <bs-nav-item event-key="rel-abut">Abuts / Abutted By</bs-nav-item>
                      <bs-nav-item event-key="rel-bond">Bonds To / Equal To</bs-nav-item>
                      <bs-nav-item event-key="rel-temporal">Temporal Sequence</bs-nav-item>
                    </bs-nav>
                    <bs-tab-content animation="true">
                      <bs-tab-pane event-key="rel-cover">
                        <mp-field-visualization subject='[[this]]' fields='[[fieldDefinitions us_rel_covers="http://www.lynx-platform.com/field/us_rel_covers" us_rel_covered_by="http://www.lynx-platform.com/field/us_rel_covered_by"]]' template='{{> template}}'><template id="template">{{> rsp:ResourceFieldBasedVisualization subject="[[this]]"}}</template></mp-field-visualization>
                      </bs-tab-pane>
                      <bs-tab-pane event-key="rel-cut">
                        <mp-field-visualization subject='[[this]]' fields='[[fieldDefinitions us_rel_cuts="http://www.lynx-platform.com/field/us_rel_cuts" us_rel_cut_by="http://www.lynx-platform.com/field/us_rel_cut_by"]]' template='{{> template}}'><template id="template">{{> rsp:ResourceFieldBasedVisualization subject="[[this]]"}}</template></mp-field-visualization>
                      </bs-tab-pane>
                      <bs-tab-pane event-key="rel-fill">
                        <mp-field-visualization subject='[[this]]' fields='[[fieldDefinitions us_rel_fills="http://www.lynx-platform.com/field/us_rel_fills" us_rel_filled_by="http://www.lynx-platform.com/field/us_rel_filled_by"]]' template='{{> template}}'><template id="template">{{> rsp:ResourceFieldBasedVisualization subject="[[this]]"}}</template></mp-field-visualization>
                      </bs-tab-pane>
                      <bs-tab-pane event-key="rel-abut">
                        <mp-field-visualization subject='[[this]]' fields='[[fieldDefinitions us_rel_abuts="http://www.lynx-platform.com/field/us_rel_abuts" us_rel_abutted_by="http://www.lynx-platform.com/field/us_rel_abutted_by"]]' template='{{> template}}'><template id="template">{{> rsp:ResourceFieldBasedVisualization subject="[[this]]"}}</template></mp-field-visualization>
                      </bs-tab-pane>
                      <bs-tab-pane event-key="rel-bond">
                        <mp-field-visualization subject='[[this]]' fields='[[fieldDefinitions us_rel_bonds_to="http://www.lynx-platform.com/field/us_rel_bonds_to" us_rel_equal_to="http://www.lynx-platform.com/field/us_rel_equal_to"]]' template='{{> template}}'><template id="template">{{> rsp:ResourceFieldBasedVisualization subject="[[this]]"}}</template></mp-field-visualization>
                      </bs-tab-pane>
                      <bs-tab-pane event-key="rel-temporal">
                        <mp-field-visualization subject='[[this]]' fields='[[fieldDefinitions us_rel_occurs_before="http://www.lynx-platform.com/field/us_rel_occurs_before" us_rel_occurs_after="http://www.lynx-platform.com/field/us_rel_occurs_after"]]' template='{{> template}}'><template id="template">{{> rsp:ResourceFieldBasedVisualization subject="[[this]]"}}</template></mp-field-visualization>
                      </bs-tab-pane>
                    </bs-tab-content>
                  </div>
                </bs-tab-container>
              </div>
            </bs-tab-pane>

            <!-- NEW TAB: Artifacts connected to this Stratigraphic Unit -->
            <bs-tab-pane event-key="finds">
              <div class="rs-resource-tab-container">
                <hr class="rs-resource-section--headerLine">
                <span class="h1 rs-resource-section--header">Reperti rinvenuti nell'Unità Stratigrafica</span>
                <div style="margin-top: 15px;">
                  <semantic-table query='
                    PREFIX crm: <http://www.cidoc-crm.org/cidoc-crm/>
                    PREFIX crmarchaeo: <http://www.cidoc-crm.org/extensions/crmarchaeo/>
                    PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>

                    SELECT DISTINCT ?artifact ?identifier ?typeLabel ?description WHERE {
                      BIND(<[[this]]> AS ?us)
                      { ?us crmarchaeo:AP21_contains ?artifact . }
                      UNION
                      { ?artifact crm:P46i_forms_part_of ?us . }
                      
                      ?artifact a crm:E18_Physical_Thing .
                      OPTIONAL {
                        ?artifact crm:P1_is_identified_by ?id .
                        ?id rdfs:label ?identifier .
                      }
                      OPTIONAL {
                        ?artifact crm:P2_has_type ?type .
                        ?type rdfs:label ?typeLabel .
                      }
                      OPTIONAL {
                        ?artifact crm:P67i_is_referred_to_by ?desc .
                        ?desc rdfs:label ?description .
                      }
                    }'
                    column-configuration='[
                      {
                        "displayName": "Reperto",
                        "cellTemplate": "<semantic-link iri=\"{{artifact.value}}\">{{#if identifier.value}}{{identifier.value}}{{else}}{{artifact.value}}{{/if}}</semantic-link>"
                      },
                      {
                        "displayName": "Tipologia",
                        "cellTemplate": "<div>{{typeLabel.value}}</div>"
                      },
                      {
                        "displayName": "Descrizione",
                        "cellTemplate": "<div>{{description.value}}</div>"
                      }
                    ]'
                    no-result-template='<div class="alert alert-info">Nessun manufatto direttamente collegato a questa Unità Stratigrafica.</div>'>
                  </semantic-table>
                </div>
              </div>
            </bs-tab-pane>

            <bs-tab-pane event-key="documentation">
              <div class="rs-resource-tab-container">
                <div class="rs-resource-data-table">
                  <mp-field-visualization
                    subject='[[this]]'
                    fields='[[fieldDefinitions us_representation="http://www.lynx-platform.com/field/us_representation" us_digital_object="http://www.lynx-platform.com/field/us_digital_object" us_competent_body="http://www.lynx-platform.com/field/us_competent_body" us_responsible_body="http://www.lynx-platform.com/field/us_responsible_body"]]'
                    template='{{> template}}'>
                    <template id="template">{{> rsp:ResourceFieldBasedVisualization subject="[[this]]"}}</template>
                  </mp-field-visualization>
                </div>
              </div>
            </bs-tab-pane>
          </bs-tab-content>
        </div>
      </bs-tab-container>
    </div>
  </template>
</with-types>
[[/if]]

[[#*inline "resourceHeaderData"]]
  [[#block "headerData"]]
  <div class="rs-resource-header--singletitle">
    <div class="rs-resource-header--title" style="text-transform: capitalize;">
      <mp-label iri='[[this]]'></mp-label>
    </div>
    <div style="display: flex;">
      <mp-copy-to-clipboard text='[[this]]'>
        <div class="rs-copy-IRI">Copy IRI</div>
      </mp-copy-to-clipboard>
      <mp-sparql-download
        query='CONSTRUCT { ?s ?p ?o } WHERE { BIND(<[[this]]> AS ?root) { ?root ?p ?o . BIND(?root AS ?s) } UNION { ?s ?p ?root . BIND(?root AS ?o) } UNION { ?n ?p1 ?root . ?n ?p ?o . BIND(?n AS ?s) } UNION { ?root ?p1 ?n . ?n ?p ?o . BIND(?n AS ?s) } }'
        header='application/ld+json'
        filename='resource-graph.jsonld'>
        <button class="btn btn-default">Download JSON-LD</button>
      </mp-sparql-download>
      <div class="statements">Statements</div>
    </div>
  </div>
  [[/block]]
[[/inline]]
