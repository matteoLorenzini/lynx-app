name: Deploy ResearchSpace

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, Linux]
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set paths
        shell: bash
        run: |
          compose_root="${RESEARCHSPACE_COMPOSE_ROOT:-/home/matteo/researchspace-docker-desktop-main}"

          echo "COMPOSE_ROOT=$compose_root"                          >> "$GITHUB_ENV"
          echo "RUNTIME_TARGET=$compose_root/researchspace/runtime-data" >> "$GITHUB_ENV"
          echo "SERVICE_NAME=researchspace"                          >> "$GITHUB_ENV"

      - name: Sync changed files only
        shell: bash
        run: |
          set -euo pipefail
          target="$RUNTIME_TARGET"

          echo '========================================'
          echo 'ResearchSpace deployment'
          echo "Source: $PWD"
          echo "Target: $target"
          echo '========================================'

          [[ -d "$target" ]] || { echo "::error::Runtime directory not found: $target"; exit 1; }
          command -v rsync >/dev/null || { echo "::error::rsync not installed (sudo dnf install rsync)"; exit 1; }

          # --checksum: copy only files whose content changed. A fresh checkout gives
          #             every file a new timestamp, so comparing dates would copy everything.
          # no --delete: files in the runtime that are not in the repo are left alone.
          sync() {
            local src="$1" dst="$2"
            if [[ ! -e "$src" ]]; then
              echo "Skipping missing: $src"
              return
            fi
            echo
            echo "Syncing: $src"
            echo "  -> $dst"
            if [[ -d "$src" ]]; then
              mkdir -p "$dst"
              rsync -r --checksum --out-format='  Updated: %n' "$src"/ "$dst"/
            else
              mkdir -p "$(dirname "$dst")"
              rsync --checksum --out-format='  Updated: %n' "$src" "$dst"
            fi
          }

          # Files/directories deployed to ResearchSpace runtime-data
          sync plugin.properties "$target/plugin.properties"
          for dir in assets config data images lib; do
            sync "$dir" "$target/$dir"
          done

          echo
          echo '========================================'
          echo 'Sync complete'
          echo 'Only changed files were updated.'
          echo 'No files were deleted from the runtime.'
          echo '========================================'

      - name: Restart ResearchSpace
        shell: bash
        run: |
          set -euo pipefail
          compose_file="$COMPOSE_ROOT/docker-compose.yml"

          [[ -f "$compose_file" ]] || { echo "::error::Docker Compose file not found: $compose_file"; exit 1; }
          command -v docker >/dev/null || { echo "::error::Docker is not installed on the runner"; exit 1; }

          docker compose --project-directory "$COMPOSE_ROOT" -f "$compose_file" restart "$SERVICE_NAME"

      - name: Verify deployment
        shell: bash
        run: |
          url='http://localhost:10214/'
          echo "Waiting for ResearchSpace at $url"

          for ((attempt = 1; attempt <= 24; attempt++)); do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "$url" || true)"

            if [[ "$code" =~ ^[0-9]+$ ]] && (( code >= 100 && code < 500 )); then
              echo "Service is responding (HTTP $code)"
              echo 'Deployment successful - ResearchSpace was restarted'
              exit 0
            fi

            echo "Attempt $attempt/24: service not ready yet (HTTP ${code:-none})"
            sleep 5
          done

          echo "::error::Service did not become ready at $url"
          exit 1