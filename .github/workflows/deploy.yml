name: Deploy ResearchSpace

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, linux]
    timeout-minutes: 5
    env:
      DEPLOY_APP_PATH: ${{ secrets.DEPLOY_APP_PATH }}
      DEPLOY_CONTAINER_NAME: ${{ secrets.DEPLOY_CONTAINER_NAME }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$DEPLOY_APP_PATH" ]]; then
            echo "DEPLOY_APP_PATH secret is not set"
            exit 1
          fi

          if [[ -z "$DEPLOY_CONTAINER_NAME" ]]; then
            echo "DEPLOY_CONTAINER_NAME secret is not set"
            exit 1
          fi

          if [[ ! -d "$DEPLOY_APP_PATH" ]]; then
            echo "Deploy target directory not found: $DEPLOY_APP_PATH"
            exit 1
          fi

          if [[ ! -w "$DEPLOY_APP_PATH" ]]; then
            echo "Deploy target directory is not writable: $DEPLOY_APP_PATH"
            exit 1
          fi

          if ! docker inspect "$DEPLOY_CONTAINER_NAME" >/dev/null 2>&1; then
            echo "Container not found: $DEPLOY_CONTAINER_NAME"
            exit 1
          fi

          deploy_realpath=$(realpath "$DEPLOY_APP_PATH")
          mount_match=0

          echo "Container mount sources:"
          while IFS= read -r mount_source; do
            [[ -n "$mount_source" ]] || continue
            echo "- $mount_source"

            mount_realpath=$(realpath "$mount_source" 2>/dev/null || printf '%s' "$mount_source")
            if [[ "$deploy_realpath" == "$mount_realpath" || "$deploy_realpath" == "$mount_realpath/"* ]]; then
              mount_match=1
            fi
          done < <(docker inspect --format '{{range .Mounts}}{{println .Source}}{{end}}' "$DEPLOY_CONTAINER_NAME")

          if [[ "$mount_match" -ne 1 ]]; then
            echo "DEPLOY_APP_PATH is not inside any bind-mounted host path for container $DEPLOY_CONTAINER_NAME"
            echo "Configured deploy path: $DEPLOY_APP_PATH"
            exit 1
          fi

      - name: Sync changed files only
        shell: bash
        run: |
          set -euo pipefail

          echo "Syncing app files to: $DEPLOY_APP_PATH"

          paths=(plugin.properties assets config data images lib)
          for path in "${paths[@]}"; do
            if [[ -e "$path" ]]; then
              if [[ -d "$path" ]]; then
                mkdir -p "$DEPLOY_APP_PATH/$path"
                rsync -r --update --itemize-changes "$path/" "$DEPLOY_APP_PATH/$path/"
              else
                mkdir -p "$DEPLOY_APP_PATH"
                rsync --update --itemize-changes "$path" "$DEPLOY_APP_PATH/$path"
              fi
            fi
          done

          echo "Sync complete - only changed files updated"

      - name: Restart container
        shell: bash
        run: |
          echo "Restarting container: $DEPLOY_CONTAINER_NAME"
          docker restart "$DEPLOY_CONTAINER_NAME"

      - name: Verify deployment
        shell: bash
        run: |
          set -euo pipefail

          url="http://localhost:10214/"
          for attempt in {1..12}; do
            status_code=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 5 "$url" || true)

            if [[ "$status_code" =~ ^[23][0-9][0-9]$ ]]; then
              echo "Service is responding (HTTP $status_code)"
              echo "Deployment successful - files synced and container restarted"
              exit 0
            fi

            echo "Attempt $attempt/12: service not ready yet at $url (HTTP ${status_code:-curl-error})"
            sleep 5
          done

          echo "Service did not become ready at $url after restart"
          docker ps --filter "name=$DEPLOY_CONTAINER_NAME"
          exit 1
