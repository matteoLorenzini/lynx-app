[[#*inline "resource"]]
<with-types fixed-key='resource-[[this]]' iri='[[this]]' template='{{> page}}' [[> rsp:TypeMappings]]>
  <template id='page'>
    <div class="rs-resource-container">
      <div class="rs-resource-header {{getValueByKey entityBgColor allTypes 'rs-entity-bg-thing'}}" style="min-height: 400px;">
        <div class="rs-resource-header-topContainer">
          <div class="rs-resource-header-topButtons">
            <semantic-link-container uri='[[resolvePrefix "rsp:ThinkingFrames"]]' urlqueryparam-view='knowledge-map' urlqueryparam-resource='[[this]]'>
              <button type="button" title="Author Resource in Knowledge Map">
                <rs-icon icon-type="round" icon-name="account_tree"></rs-icon>
              </button>
            </semantic-link-container>
            <mp-event-trigger id='details-view-trigger' type='Component.TemplateUpdate' data='{"iri": "{{iri}}"}' targets='["details-view", "open-details-sidebar"]'>
              <button type="button" title="Resource Details">
                <rs-icon icon-type="rounded" icon-name="info" symbol="true"></rs-icon>
              </button>
            </mp-event-trigger>
            <semantic-link-container uri='http://www.researchspace.org/resource/ResourceContentEditE18' urlqueryparam-resource='[[this]]'>
              <button type="button" title="Author Resource in Form">
                <rs-icon icon-type="rounded" icon-name="edit_note" symbol="true"></rs-icon>
              </button>
            </semantic-link-container>
          </div>
        </div>
        <div class="rs-resource-header-content-container">
          <div class="rs-resource-header--image-container" style="min-height: 350px; flex: 1.5;">
            <div class="object-representations__image--focused">
              <span class="rs-icon {{getValueByKey typeToImage allTypes 'rs-icon-entity_no-image'}} {{getValueByKey entityIconColor allTypes 'rs-icon-entity_no-image'}}"></span>
            </div>
          </div>
          <div style="padding: 1.8% 1.5% 1.5% 5%; flex: 1;">
            <div class="rs-resource-header--singletitle">
              <div class="rs-resource-header--title" style="text-transform: capitalize;">
                <mp-label iri='[[this]]'></mp-label>
              </div>
              <div style="display: flex;">
                <mp-copy-to-clipboard text='[[this]]'>
                  <div class="rs-copy-IRI">Copy IRI</div>
                </mp-copy-to-clipboard>
                <div class="statements">Statements</div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Tabs: own layout, no rs-resource-tabs class (its CSS expects the default RS markup) -->
      <bs-tab-container id="person-tabs" default-active-key="person-identification">
        <div style="display: flex; align-items: flex-start; gap: 24px; width: 100%; padding: 24px 2%; box-sizing: border-box;">

          <div style="flex: 0 0 230px; position: sticky; top: 16px;">
            <bs-nav bs-style="pills" stacked=true>
              <bs-nav-item event-key="person-identification">Identification</bs-nav-item>
              <bs-nav-item event-key="person-biography">Biography</bs-nav-item>
              <bs-nav-item event-key="person-education">Education</bs-nav-item>
              <bs-nav-item event-key="person-career">Career</bs-nav-item>
              <bs-nav-item event-key="person-research">Excavations &amp; Publications</bs-nav-item>
              <bs-nav-item event-key="person-timeline">Timeline</bs-nav-item>
            </bs-nav>
          </div>

          <div style="flex: 1 1 auto; min-width: 0;">
            <bs-tab-content animation=false mount-on-enter=true>

              <bs-tab-pane event-key="person-identification">
                <div class="rs-resource-tab-container">
                  <div>
                    <hr class="rs-resource-section--headerLine">
                    <span class="h1 rs-resource-section--header">Identification</span>
                  </div>
                  <div class="rs-resource-data-table">
                    <mp-field-visualization
                      subject='[[this]]'
                      fields='[[fieldDefinitions name="http://www.lynx-platform.com/field/person_name" unique_id="http://www.lynx-platform.com/field/person_unique_id" type="http://www.lynx-platform.com/field/person_type" occupation="http://www.lynx-platform.com/field/person_occupation"]]'
                      template='{{> template}}'>
                      <template id="template">{{> rsp:ResourceFieldBasedVisualization subject="[[this]]"}}</template>
                    </mp-field-visualization>
                  </div>
                </div>
              </bs-tab-pane>

              <bs-tab-pane event-key="person-biography">
                <div class="rs-resource-tab-container">
                  <div>
                    <hr class="rs-resource-section--headerLine">
                    <span class="h1 rs-resource-section--header">Biography</span>
                  </div>
                  <div class="rs-resource-data-table">
                    <mp-field-visualization
                      subject='[[this]]'
                      fields='[[fieldDefinitions biography="http://www.lynx-platform.com/field/person_biography" birth_date="http://www.lynx-platform.com/field/person_birth_date" birth_place="http://www.lynx-platform.com/field/person_birth_place"]]'
                      template='{{> template}}'>
                      <template id="template">{{> rsp:ResourceFieldBasedVisualization subject="[[this]]"}}</template>
                    </mp-field-visualization>
                  </div>
                </div>
              </bs-tab-pane>

              <bs-tab-pane event-key="person-education">
                <div class="rs-resource-tab-container">
                  <div>
                    <hr class="rs-resource-section--headerLine">
                    <span class="h1 rs-resource-section--header">Education</span>
                  </div>
                  <div class="rs-resource-data-table">
                    <mp-field-visualization
                      subject='[[this]]'
                      fields='[[fieldDefinitions graduation="http://www.lynx-platform.com/field/person_graduation" habilitation="http://www.lynx-platform.com/field/person_habilitation" teachers="http://www.lynx-platform.com/field/person_teachers" mentors="http://www.lynx-platform.com/field/person_mentors"]]'
                      template='{{> template}}'>
                      <template id="template">{{> rsp:ResourceFieldBasedVisualization subject="[[this]]"}}</template>
                    </mp-field-visualization>
                  </div>
                </div>
              </bs-tab-pane>

              <bs-tab-pane event-key="person-career">
                <div class="rs-resource-tab-container">
                  <div>
                    <hr class="rs-resource-section--headerLine">
                    <span class="h1 rs-resource-section--header">Career</span>
                  </div>
                  <div class="rs-resource-data-table">
                    <mp-field-visualization
                      subject='[[this]]'
                      fields='[[fieldDefinitions positions="http://www.lynx-platform.com/field/person_positions" assistantships="http://www.lynx-platform.com/field/person_assistantships" professorships="http://www.lynx-platform.com/field/person_professorships" directorships="http://www.lynx-platform.com/field/person_directorships" institutions="http://www.lynx-platform.com/field/person_institutions" activity_places="http://www.lynx-platform.com/field/person_activity_places"]]'
                      template='{{> template}}'>
                      <template id="template">{{> rsp:ResourceFieldBasedVisualization subject="[[this]]"}}</template>
                    </mp-field-visualization>
                  </div>
                </div>
              </bs-tab-pane>

              <bs-tab-pane event-key="person-research">
                <div class="rs-resource-tab-container">
                  <div>
                    <hr class="rs-resource-section--headerLine">
                    <span class="h1 rs-resource-section--header">Excavations &amp; Publications</span>
                  </div>
                  <div class="rs-resource-data-table">
                    <mp-field-visualization
                      subject='[[this]]'
                      fields='[[fieldDefinitions excavations="http://www.lynx-platform.com/field/person_excavations" publications="http://www.lynx-platform.com/field/person_publications"]]'
                      template='{{> template}}'>
                      <template id="template">{{> rsp:ResourceFieldBasedVisualization subject="[[this]]"}}</template>
                    </mp-field-visualization>
                  </div>
                </div>
              </bs-tab-pane>

              <bs-tab-pane event-key="person-timeline">
                <div class="rs-resource-tab-container">
                  <div>
                    <hr class="rs-resource-section--headerLine">
                    <span class="h1 rs-resource-section--header">Timeline</span>
                  </div>
                  <div class="rs-resource-data-table">
                    <mp-field-visualization
                      subject='[[this]]'
                      fields='[[fieldDefinitions timeline_events="http://www.lynx-platform.com/field/person_timeline_events"]]'
                      template='{{> template}}'>
                      <template id="template">{{> rsp:ResourceFieldBasedVisualization subject="[[this]]"}}</template>
                    </mp-field-visualization>
                  </div>
                </div>
              </bs-tab-pane>

            </bs-tab-content>
          </div>
        </div>
      </bs-tab-container>
    </div>
  </template>
</with-types>
[[/inline]]

[[> resource]]
