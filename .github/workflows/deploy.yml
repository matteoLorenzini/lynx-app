name: Deploy ResearchSpace

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure deployment paths
        shell: bash
        run: |
          set -euo pipefail

          COMPOSE_ROOT="/home/matteo/researchspace-docker-desktop-main"
          RUNTIME_TARGET="${COMPOSE_ROOT}/researchspace/runtime-data"

          echo "COMPOSE_ROOT=$COMPOSE_ROOT" >> "$GITHUB_ENV"
          echo "RUNTIME_TARGET=$RUNTIME_TARGET" >> "$GITHUB_ENV"

          echo "Compose root: $COMPOSE_ROOT"
          echo "Runtime target: $RUNTIME_TARGET"

      - name: Check deployment directory
        shell: bash
        run: |
          set -euo pipefail

          echo "Runner user:"
          whoami

          echo
          echo "Target directory:"
          ls -ld "$RUNTIME_TARGET"

          echo
          echo "Testing write permission..."

          test -w "$RUNTIME_TARGET" || {
            echo "ERROR: GitHub Actions runner cannot write to $RUNTIME_TARGET"
            exit 1
          }

          echo "Write permission OK"

      - name: Sync repository to ResearchSpace runtime
        shell: bash
        run: |
          set -euo pipefail

          target="$RUNTIME_TARGET"

          echo "Deploying to: $target"

          mkdir -p "$target"

          sync_dir() {
            local src="$1"
            local dst="$2"

            if [[ ! -d "$src" ]]; then
              echo "Skipping missing directory: $src"
              return 0
            fi

            mkdir -p "$dst"

            echo "Syncing:"
            echo "  $src/"
            echo "  -> $dst/"

            rsync -rlpt \
              --itemize-changes \
              "$src/" "$dst/"
          }

          sync_file() {
            local src="$1"
            local dst="$2"

            if [[ ! -f "$src" ]]; then
              echo "Skipping missing file: $src"
              return 0
            fi

            mkdir -p "$(dirname "$dst")"

            echo "Syncing:"
            echo "  $src"
            echo "  -> $dst"

            rsync -lpt \
              --itemize-changes \
              "$src" "$dst"
          }

          sync_file "$GITHUB_WORKSPACE/plugin.properties" \
                    "$target/plugin.properties"

          sync_dir "$GITHUB_WORKSPACE/assets" \
                   "$target/assets"

          sync_dir "$GITHUB_WORKSPACE/config" \
                   "$target/config"

          sync_dir "$GITHUB_WORKSPACE/data" \
                   "$target/data"

          sync_dir "$GITHUB_WORKSPACE/images" \
                   "$target/images"

          sync_dir "$GITHUB_WORKSPACE/lib" \
                   "$target/lib"

          echo
          echo "Deployment files synchronized successfully."

      - name: Verify ResearchSpace
        shell: bash
        run: |
          set -euo pipefail

          URL="http://localhost:10214/"

          echo "Checking $URL"

          status_code=$(curl \
            -s \
            -o /dev/null \
            -w "%{http_code}" \
            --max-time 10 \
            "$URL" || true)

          echo "HTTP status: ${status_code:-n/a}"

          if [[ "$status_code" =~ ^[0-9]{3}$ ]] && \
             [[ "$status_code" -lt 500 ]]; then

            echo "ResearchSpace is responding."
          else
            echo "ResearchSpace is NOT responding correctly." >&2
            exit 1
          fi