name: Deploy ResearchSpace

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set paths
        shell: bash
        run: |
          compose_root="/home/matteo/researchspace-docker-desktop-main"
          runtime_target="${compose_root}/researchspace/runtime-data"

          echo "COMPOSE_ROOT=${compose_root}" >> "$GITHUB_ENV"
          echo "RUNTIME_TARGET=${runtime_target}" >> "$GITHUB_ENV"
          echo "SERVICE_NAME=researchspace" >> "$GITHUB_ENV"

          echo "======================================"
          echo "Deployment configuration"
          echo "======================================"
          echo "COMPOSE_ROOT:   ${compose_root}"
          echo "RUNTIME_TARGET: ${runtime_target}"
          echo "SERVICE_NAME:   researchspace"
          echo "======================================"

      - name: Diagnose environment
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "Runner information"
          echo "======================================"

          echo "User:"
          whoami

          echo
          echo "UID/GID:"
          id

          echo
          echo "Hostname:"
          hostname

          echo
          echo "Workspace:"
          echo "$PWD"

          echo
          echo "======================================"
          echo "Runtime directory"
          echo "======================================"

          echo "Target:"
          echo "$RUNTIME_TARGET"

          if [[ -d "$RUNTIME_TARGET" ]]; then
            echo
            echo "Directory exists:"
            ls -ld "$RUNTIME_TARGET"

            echo
            echo "Directory contents:"
            ls -lah "$RUNTIME_TARGET" | head -50
          else
            echo "ERROR: Runtime directory does not exist:"
            echo "$RUNTIME_TARGET"
            exit 1
          fi

          echo
          echo "======================================"
          echo "Write permission"
          echo "======================================"

          test_file="$RUNTIME_TARGET/.github-actions-test"

          if touch "$test_file"; then
            echo "Runner can write to runtime directory."
            rm -f "$test_file"
          else
            echo "ERROR: Runner cannot write to runtime directory."
            exit 1
          fi

      - name: Sync changed files only
        shell: bash
        run: |
          set -euo pipefail

          target="$RUNTIME_TARGET"

          echo "======================================"
          echo "Starting file synchronization"
          echo "======================================"

          echo "Target:"
          echo "$target"

          if [[ ! -d "$target" ]]; then
            echo "Runtime directory not found: $target" >&2
            exit 1
          fi

          sync_dir() {
            src="$1"
            dst="$2"

            echo
            echo "--------------------------------------"
            echo "Synchronizing directory"
            echo "--------------------------------------"
            echo "Source:      $src"
            echo "Destination: $dst"

            if [[ ! -d "$src" ]]; then
              echo "Source does not exist - skipping:"
              echo "$src"
              return 0
            fi

            mkdir -p "$dst"

            echo
            echo "Source:"
            ls -ld "$src"

            echo
            echo "Destination:"
            ls -ld "$dst"

            echo
            echo "Running:"
            echo "rsync -av --update --itemize-changes \"$src/\" \"$dst/\""

            echo
            echo "Rsync output:"
            echo "--------------------------------------"

            rsync \
              -av \
              --update \
              --itemize-changes \
              "$src/" \
              "$dst/"

            echo "--------------------------------------"
            echo "Directory synchronization completed."
          }

          sync_dir "$PWD/data" "$target/data"
          sync_dir "$PWD/ldp" "$target/ldp"
          sync_dir "$PWD/file" "$target/file"
          sync_dir "$PWD/images" "$target/images"

          echo
          echo "======================================"
          echo "Sync complete"
          echo "======================================"
          echo "Only changed files were updated."

      - name: Verify synchronized files
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "Verifying deployed files"
          echo "======================================"

          echo "Runtime target:"
          echo "$RUNTIME_TARGET"

          echo
          echo "Directory contents:"
          find "$RUNTIME_TARGET" \
            -maxdepth 3 \
            -type f \
            -print | sort | head -200

      - name: Verify deployment
        shell: bash
        run: |
          set -euo pipefail

          url="http://localhost:10214/"

          echo "======================================"
          echo "ResearchSpace health check"
          echo "======================================"

          echo "URL: $url"

          status_code=$(curl \
            -s \
            -o /dev/null \
            -w "%{http_code}" \
            --max-time 5 \
            "$url" || true)

          echo "HTTP status: ${status_code:-n/a}"

          if [[ "$status_code" =~ ^[0-9]{3}$ ]] && \
             [[ "$status_code" -lt 500 ]]; then

            echo
            echo "Service is responding (HTTP $status_code)"
            echo "Deployment successful - files updated without restart"

          else

            echo
            echo "Service is not responding at $url"
            echo "HTTP status: ${status_code:-n/a}"

            exit 1
          fi