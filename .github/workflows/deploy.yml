name: Deploy ResearchSpace

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, Windows]
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set paths
        shell: pwsh
        run: |
          $composeRoot = if ($env:RESEARCHSPACE_COMPOSE_ROOT) {
            $env:RESEARCHSPACE_COMPOSE_ROOT
          } else {
            Join-Path $env:USERPROFILE 'researchspace-docker-desktop-main'
          }
          $runtimeTarget = Join-Path $composeRoot 'researchspace/runtime-data'

          "COMPOSE_ROOT=$composeRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RUNTIME_TARGET=$runtimeTarget" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          'SERVICE_NAME=researchspace' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Sync changed files only
        shell: pwsh
        run: |
          $target = $env:RUNTIME_TARGET

          Write-Output '========================================'
          Write-Output 'ResearchSpace deployment'
          Write-Output "Source: $PWD"
          Write-Output "Target: $target"
          Write-Output '========================================'

          if (-not (Test-Path -LiteralPath $target -PathType Container)) {
            throw "Runtime directory not found: $target"
          }

          function Sync-Directory {
            param([string]$Source, [string]$Destination)

            if (-not (Test-Path -LiteralPath $Source -PathType Container)) {
              Write-Output "Skipping missing directory: $Source"
              return
            }

            New-Item -ItemType Directory -Path $Destination -Force | Out-Null

            Write-Output ''
            Write-Output 'Syncing directory:'
            Write-Output "  $Source"
            Write-Output "  -> $Destination"

            $sourceRoot = (Get-Item -LiteralPath $Source).FullName
            Get-ChildItem -LiteralPath $sourceRoot -File -Recurse | ForEach-Object {
              $relativePath = $_.FullName.Substring($sourceRoot.Length).TrimStart('\', '/')
              $destinationPath = Join-Path $Destination $relativePath
              $destinationParent = Split-Path -Parent $destinationPath
              New-Item -ItemType Directory -Path $destinationParent -Force | Out-Null

              $isNewer = -not (Test-Path -LiteralPath $destinationPath) -or
                $_.LastWriteTimeUtc -gt (Get-Item -LiteralPath $destinationPath).LastWriteTimeUtc
              if ($isNewer) {
                Copy-Item -LiteralPath $_.FullName -Destination $destinationPath -Force
                Write-Output "  Updated: $relativePath"
              }
            }
          }

          function Sync-File {
            param([string]$Source, [string]$Destination)

            if (-not (Test-Path -LiteralPath $Source -PathType Leaf)) {
              Write-Output "Skipping missing file: $Source"
              return
            }

            $destinationParent = Split-Path -Parent $Destination
            New-Item -ItemType Directory -Path $destinationParent -Force | Out-Null

            Write-Output ''
            Write-Output 'Syncing file:'
            Write-Output "  $Source"
            Write-Output "  -> $Destination"

            $isNewer = -not (Test-Path -LiteralPath $Destination) -or
              (Get-Item -LiteralPath $Source).LastWriteTimeUtc -gt (Get-Item -LiteralPath $Destination).LastWriteTimeUtc
            if ($isNewer) {
              Copy-Item -LiteralPath $Source -Destination $Destination -Force
              Write-Output '  Updated'
            }
          }

          # Files/directories deployed to ResearchSpace runtime-data.
          Sync-File (Join-Path $PWD 'plugin.properties') (Join-Path $target 'plugin.properties')

          Sync-Directory (Join-Path $PWD 'assets') (Join-Path $target 'assets')
          Sync-Directory (Join-Path $PWD 'config') (Join-Path $target 'config')
          Sync-Directory (Join-Path $PWD 'data') (Join-Path $target 'data')
          Sync-Directory (Join-Path $PWD 'images') (Join-Path $target 'images')
          Sync-Directory (Join-Path $PWD 'lib') (Join-Path $target 'lib')

          Write-Output ''
          Write-Output '========================================'
          Write-Output 'Sync complete'
          Write-Output 'Only changed files were updated.'
          Write-Output 'No files were deleted from the runtime.'
          Write-Output '========================================'

      - name: Verify deployment
        shell: pwsh
        run: |
          $url = 'http://localhost:10214/'

          Write-Output "Checking ResearchSpace at $url"

          $statusCode = 0
          try {
            $response = Invoke-WebRequest -Uri $url -TimeoutSec 5 -UseBasicParsing
            $statusCode = [int]$response.StatusCode
          } catch {
            if ($_.Exception.Response) {
              $statusCode = [int]$_.Exception.Response.StatusCode
            }
          }

          if ($statusCode -ge 100 -and $statusCode -lt 500) {
            Write-Output "Service is responding (HTTP $statusCode)"
            Write-Output 'Deployment successful - files updated without restart'
          } else {
            throw "Service is not responding at $url (HTTP $statusCode)"
          }