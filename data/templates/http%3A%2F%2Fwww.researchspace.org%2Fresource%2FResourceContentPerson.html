[[#if (urlParam "details")]]
<div class="details-content">
  <bs-tabs class="details-tabs">
    <bs-tab title='Person Description' event-key='person-description' mount-on-enter=true class="rawdata-tab">
      <mp-field-visualization
        subject='[[this]]'
        fields='[[fieldDefinitions name="http://www.lynx-platform.com/field/person_name" unique_id="http://www.lynx-platform.com/field/person_unique_id" occupation="http://www.lynx-platform.com/field/person_occupation" birth_date="http://www.lynx-platform.com/field/person_birth_date" birth_place="http://www.lynx-platform.com/field/person_birth_place" biography="http://www.lynx-platform.com/field/person_biography" ]]'
        template='{{> template}}'>
        <template id="template">{{> rsp:ResourceFieldBasedVisualization subject="[[this]]"}}</template>
      </mp-field-visualization>
    </bs-tab>
  </bs-tabs>
</div>
[[else]]
<with-types fixed-key='resource-[[this]]' iri='[[this]]' template='{{> resource}}' [[> rsp:TypeMappings]]>
  <template id='resource'>
    <div class="rs-resource-container">
      [[#block "resourceHeader"]]
      <!-- Resource Header -->
      <div class="rs-resource-header {{getValueByKey entityBgColor allTypes 'rs-entity-bg-thing'}}">
        <!-- Header top -->
        <div class="rs-resource-header-topContainer">
          [[#block "resourceHeaderTop"]]
          <!-- (Popover code removed) -->
          [[/block]]
          <div class="rs-resource-header-topButtons">
            <semantic-link-container uri='[[resolvePrefix "rsp:ThinkingFrames"]]' urlqueryparam-view='knowledge-map' urlqueryparam-resource='[[this]]'>
              <button type="button" title="Author Resource in Knowledge Map">
                <rs-icon icon-type="round" icon-name="account_tree"></rs-icon>
              </button>
            </semantic-link-container>
            <mp-event-trigger id='details-view-trigger' type='Component.TemplateUpdate' data='{"iri": "{{iri}}"}' targets='["details-view", "open-details-sidebar"]'>
              <button type="button" title="Resource Details">
                <rs-icon icon-type="rounded" icon-name="info" symbol="true"></rs-icon>
              </button>
            </mp-event-trigger>
            <!-- TODO: point to the Person authoring form when it exists (E18 form kept as placeholder) -->
            <mp-has-permission permission="api:ldp:*">
              <semantic-link-container uri='http://www.researchspace.org/resource/ResourceContentEditE18' urlqueryparam-resource='[[this]]'>
                <button type="button" title="Author Resource in Form">
                  <rs-icon icon-type="rounded" icon-name="edit_note" symbol="true"></rs-icon>
                </button>
              </semantic-link-container>
            </mp-has-permission>
          </div>
        </div>
        <!-- Header content: entity icon + primary information -->
        <div class="rs-resource-header-content-container">
          <div class="rs-resource-header--image-container">
            <!-- Portrait preview: via E31 document (same pattern as E18) or via E36 visual representation -->
            <semantic-query query='
PREFIX pico: <http://data.cochrane.org/ontologies/pico/>
PREFIX crm: <http://www.cidoc-crm.org/cidoc-crm/>
PREFIX rs: <http://www.researchspace.org/ontology/>

SELECT DISTINCT ?subject ?document ?preview ?previewIiif
WHERE {
  BIND(<[[this]]> AS ?subject)

  {
    ?subject a crm:E21_Person ;
             crm:P70i_is_documented_in ?document .
    ?document a crm:E31_Document ;
              pico:preview ?preview .
  }

  UNION

  {
    ?subject a crm:E21_Person ;
             crm:P138i_has_representation ?document .
    ?document pico:preview ?preview .
  }

  BIND(
    IF(
      STRSTARTS(STR(?preview), "http://"),
      IRI(CONCAT("https://", STRAFTER(STR(?preview), "http://"))),
      ?preview
    ) AS ?previewSafe
  )
  OPTIONAL { ?preview rs:PX_has_file_name ?previewFileName . }
  BIND(STR(?preview) AS ?previewStr)
  BIND(STR(?previewSafe) AS ?previewSafeStr)
  BIND(IF(REGEX(?previewStr, "/resource/EX_File/", "i"), REPLACE(?previewStr, "^.*/EX_File/", ""), "") AS ?previewFileFromIri)
  BIND(COALESCE(STR(?previewFileName), ?previewFileFromIri, "") AS ?previewFileAny)
  BIND(
    IF(
      STRLEN(?previewFileAny) > 0,
      CONCAT("/proxy/IIIF/2/", ENCODE_FOR_URI(?previewFileAny), "/full/!700,700/0/default.jpg"),
      IF(REGEX(?previewSafeStr, "^https://", "i"), ?previewSafeStr, "")
    ) AS ?previewIiif
  )
}
ORDER BY ?subject LIMIT 1' template='{{> headerPreview}}'>
          <template id="headerPreview">
            {{#with bindings.[0]}}
              {{#if preview.value}}
                <div class="detail-thumb" style="margin-bottom:8px;">
                  {{#if previewIiif.value}}
                    <a href="{{previewIiif.value}}" target="_blank" rel="noopener">
                      <img src="{{previewIiif.value}}" alt="Portrait" style="max-width:240px; max-height:160px; object-fit:cover; border-radius:4px; display:block;" />
                    </a>
                  {{else}}
                    <a href="{{preview.value}}" target="_blank" rel="noopener">
                      <mp-resource-thumbnail iri='{{preview.value}}' no-image-uri='/images/help/thenounproject/noun_1113333.svg' style="max-width:240px; max-height:160px; display:block;" />
                    </a>
                  {{/if}}
                </div>
              {{/if}}
            {{/with}}
          </template>
        </semantic-query>

            <div class="rs-resource-img__btngroup">
              <mp-overlay-dialog title="Resource Media" type="modal" class="modal-xlSize">
                <mp-overlay-dialog-trigger>
                  <button type="button" class="btn btn-icon" title="Explore Media">
                    <rs-icon icon-type="rounded" icon-name="fullscreen" symbol="true"></rs-icon>
                  </button>
                </mp-overlay-dialog-trigger>
                <mp-overlay-dialog-content>
                  <mp-page-loader urlqueryparam-frame=true iri='http://www.researchspace.org/resource/ItemCardMedia' context='[[this]]'></mp-page-loader>
                </mp-overlay-dialog-content>
              </mp-overlay-dialog>
              <semantic-link-container uri='[[resolvePrefix "rsp:ThinkingFrames"]]' urlqueryparam-view='iiif' urlqueryparam-resource='[[this]]'>
                <button type="button" class="btn btn-icon" title="Explore Images in high resolution Viewer">
                  <rs-icon icon-type="rounded" icon-name="image" symbol="true"></rs-icon>
                </button>
              </semantic-link-container>
            </div>
          </div>
          <div style="padding: 1.8% 1.5% 1.5% 5%;">
            [[> resourceHeaderData image=true]]
            <!-- Inline map: places linked to the person (birth place + places of activity) that have a geometry -->
            <div style="margin-top: 8px;">
              <semantic-if
                query='PREFIX crm: <http://www.cidoc-crm.org/cidoc-crm/>
                       ASK {
                         { <[[this]]> crm:P98i_was_born/crm:P7_took_place_at ?place . }
                         UNION { <[[this]]> crm:P11i_took_part_in/crm:P7_took_place_at ?place . }
                         UNION { <[[this]]> crm:P14i_performed/crm:P7_took_place_at ?place . }
                         ?place crm:P168_place_is_defined_by ?wkt .
                       }'
                then='{{> mapBlock}}' else='{{> mapNoLocation}}'>
                <template id='mapBlock'>
                  <div style="height:220px;">
                    <semantic-map
                      id='map-result'
                      query='
                        PREFIX crm:  <http://www.cidoc-crm.org/cidoc-crm/>
                        PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>

                        SELECT DISTINCT ?wkt ?place ?label WHERE {
                          BIND(<[[this]]> AS ?subject)
                          { ?subject crm:P98i_was_born/crm:P7_took_place_at ?place . }
                          UNION { ?subject crm:P11i_took_part_in/crm:P7_took_place_at ?place . }
                          UNION { ?subject crm:P14i_performed/crm:P7_took_place_at ?place . }
                          ?place a crm:E53_Place ;
                                 crm:P168_place_is_defined_by ?wkt .
                          OPTIONAL { ?place rdfs:label ?name }
                          BIND(COALESCE(?name, STR(?place)) AS ?label)
                        }
                      '
                      tuple-template='{{> mapTupleTemplate }}'>
                      <template id='mapTupleTemplate'>
                        <semantic-link iri="{{place.value}}">{{label.value}}</semantic-link>
                      </template>
                    </semantic-map>
                  </div>
                </template>
                <template id='mapNoLocation'>
                  <div style="font-size:0.8rem;color:#666;">No geolocation available.</div>
                </template>
              </semantic-if>
            </div>
          </div>
        </div>
      </div>
      [[/block]]
      <!-- Tabs: Identification, Biography, Education, Career, Excavations & Publications, Timeline -->
      <bs-tab-container id="tab-container" class="rs-resource-tabs" default-active-key="identification">
        <div>
          <bs-nav bs-style="tabs">
            <bs-nav-item event-key="identification">Identification</bs-nav-item>
            <bs-nav-item event-key="biography">Biography</bs-nav-item>
            <bs-nav-item event-key="education">Education</bs-nav-item>
            <bs-nav-item event-key="career">Career</bs-nav-item>
            <bs-nav-item event-key="research">Excavations & Publications</bs-nav-item>
            <bs-nav-item event-key="timeline">Timeline</bs-nav-item>
          </bs-nav>
          <bs-tab-content animation="true">
            <bs-tab-pane event-key="identification">
              <div class="rs-resource-tab-container">
                <div>
                  <hr class="rs-resource-section--headerLine">
                  [[#block "instituteHeader"]]
                  <span class="h1 rs-resource-section--header">Person Information</span>
                  [[/block]]
                </div>
                <div class="rs-resource-data-table">
                  <mp-field-visualization
                    subject='[[this]]'
                    fields='[[fieldDefinitions person_name="http://www.lynx-platform.com/field/person_name" person_unique_id="http://www.lynx-platform.com/field/person_unique_id" person_type="http://www.lynx-platform.com/field/person_type" person_occupation="http://www.lynx-platform.com/field/person_occupation" ]]'
                    template='{{> template}}'>
                    <template id="template">{{> rsp:ResourceFieldBasedVisualization subject="[[this]]"}}</template>
                  </mp-field-visualization>
                </div>
              </div>
            </bs-tab-pane>
            <bs-tab-pane event-key="biography">
              <div class="rs-resource-tab-container">
                <mp-field-visualization
                    subject='[[this]]'
                    fields='[[fieldDefinitions person_birth_date="http://www.lynx-platform.com/field/person_birth_date" person_birth_place="http://www.lynx-platform.com/field/person_birth_place" person_biography="http://www.lynx-platform.com/field/person_biography" ]]'
                    template='{{> template}}'>
                    <template id="template">{{> rsp:ResourceFieldBasedVisualization subject="[[this]]"}}</template>
                  </mp-field-visualization>
              </div>
            </bs-tab-pane>
            <bs-tab-pane event-key="education">
              <div class="rs-resource-tab-container">
                <mp-field-visualization
                    subject='[[this]]'
                    fields='[[fieldDefinitions person_graduation="http://www.lynx-platform.com/field/person_graduation" person_habilitation="http://www.lynx-platform.com/field/person_habilitation" person_teachers="http://www.lynx-platform.com/field/person_teachers" person_mentors="http://www.lynx-platform.com/field/person_mentors" ]]'
                    template='{{> template}}'>
                    <template id="template">{{> rsp:ResourceFieldBasedVisualization subject="[[this]]"}}</template>
                  </mp-field-visualization>
              </div>
            </bs-tab-pane>
            <bs-tab-pane event-key="career">
              <div class="rs-resource-tab-container">
                <mp-field-visualization
                    subject='[[this]]'
                    fields='[[fieldDefinitions person_positions="http://www.lynx-platform.com/field/person_positions" person_assistantships="http://www.lynx-platform.com/field/person_assistantships" person_professorships="http://www.lynx-platform.com/field/person_professorships" person_directorships="http://www.lynx-platform.com/field/person_directorships" person_institutions="http://www.lynx-platform.com/field/person_institutions" person_activity_places="http://www.lynx-platform.com/field/person_activity_places" ]]'
                    template='{{> template}}'>
                    <template id="template">{{> rsp:ResourceFieldBasedVisualization subject="[[this]]"}}</template>
                  </mp-field-visualization>
              </div>
            </bs-tab-pane>
            <bs-tab-pane event-key="research">
              <div class="rs-resource-tab-container">
                <mp-field-visualization
                    subject='[[this]]'
                    fields='[[fieldDefinitions person_excavations="http://www.lynx-platform.com/field/person_excavations" person_publications="http://www.lynx-platform.com/field/person_publications" ]]'
                    template='{{> template}}'>
                    <template id="template">{{> rsp:ResourceFieldBasedVisualization subject="[[this]]"}}</template>
                  </mp-field-visualization>
              </div>
            </bs-tab-pane>
            <bs-tab-pane event-key="timeline">
              <div class="rs-resource-tab-container">
                <!-- Chronological list built on the same paths as the timeline_* fields -->
                <semantic-query query='
PREFIX crm: <http://www.cidoc-crm.org/cidoc-crm/>
PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>

SELECT ?event ?label ?typeLabel ?date ?begin ?placeLabel ?work ?workLabel WHERE {
  BIND(<[[this]]> AS ?subject)
  { ?subject crm:P11i_took_part_in ?event . }
  UNION
  { ?subject crm:P14i_performed ?event . }
  ?event rdfs:label ?label .
  OPTIONAL { ?event crm:P2_has_type ?type . ?type rdfs:label ?typeLabel . }
  OPTIONAL {
    ?event crm:P4_has_time-span ?ts .
    OPTIONAL { ?ts rdfs:label ?date . }
    OPTIONAL { ?ts crm:P82a_begin_of_the_begin ?begin . }
  }
  OPTIONAL { ?event crm:P7_took_place_at ?place . OPTIONAL { ?place rdfs:label ?placeLabel . } }
  OPTIONAL { ?event crm:P94_has_created ?work . ?work rdfs:label ?workLabel . }
}
ORDER BY (!BOUND(?begin)) ?begin ?label'
                  template='{{> timelineList}}'
                  no-result-template='{{> noTimeline}}'>
                  <template id="timelineList">
                    <div style="border-left:2px solid #ccc; margin:8px 0 8px 8px; padding-left:16px;">
                      {{#each bindings}}
                        <div style="margin-bottom:14px;">
                          <div style="font-size:0.8rem; color:#666;">
                            {{#if date.value}}{{date.value}}{{else}}Undated{{/if}}
                            {{#if typeLabel.value}} · {{typeLabel.value}}{{/if}}
                            {{#if placeLabel.value}} · {{placeLabel.value}}{{/if}}
                          </div>
                          <div>
                            {{#if work.value}}
                              <semantic-link iri="{{work.value}}">{{workLabel.value}}</semantic-link>
                            {{else}}
                              <semantic-link iri="{{event.value}}">{{label.value}}</semantic-link>
                            {{/if}}
                          </div>
                        </div>
                      {{/each}}
                    </div>
                  </template>
                  <template id="noTimeline">
                    <div style="font-size:0.9rem; color:#666; padding:12px 0;">No timeline events available for this person.</div>
                  </template>
                </semantic-query>
              </div>
            </bs-tab-pane>
          </bs-tab-content>
        </div>
      </bs-tab-container>
    </div>
  </template>
</with-types>
[[/if]]

[[#*inline "resourceHeaderData"]]
  [[#block "headerData"]]
  <!-- RESOURCE LABEL -->
  <div class="rs-resource-header--singletitle">
    <div class="rs-resource-header--title" style="text-transform: capitalize;">
      <mp-label iri='[[this]]'></mp-label>
    </div>
    <div style="display: flex;">
      <mp-copy-to-clipboard text='[[this]]'>
        <div class="rs-copy-IRI">Copy IRI</div>
      </mp-copy-to-clipboard>
      <mp-sparql-download
        query='CONSTRUCT { ?s ?p ?o } WHERE { BIND(<[[this]]> AS ?root) { ?root ?p ?o . BIND(?root AS ?s) } UNION { ?s ?p ?root . BIND(?root AS ?o) } UNION { ?n ?p1 ?root . ?n ?p ?o . BIND(?n AS ?s) } UNION { ?root ?p1 ?n . ?n ?p ?o . BIND(?n AS ?s) } }'
        header='application/ld+json'
        filename='resource-graph.jsonld'>
        <button class="btn btn-default">Download JSON-LD</button>
      </mp-sparql-download>
      <div class="statements">Statements</div>
    </div>
  </div>
  [[/block]]
[[/inline]]
