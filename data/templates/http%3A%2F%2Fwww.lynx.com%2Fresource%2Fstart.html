<!-- HERO UNIFIED SEARCH SECTION -->
<div class="bso-component home-search">
    <bs-col md="10" md-offset="1">
        <div class="bso-component simple-search">
            <semantic-simple-search
              query='
                PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
                PREFIX crm: <http://www.cidoc-crm.org/cidoc-crm/>
                PREFIX skos: <http://www.w3.org/2004/02/skos/core#>
                
                SELECT DISTINCT ?resource ?label ?typelabel WHERE {
                  {
                    # Objects (E18_Physical_Thing)
                    ?resource a crm:E18_Physical_Thing ;
                              crm:P1_is_identified_by ?identifier .
                    ?identifier a crm:E42_Identifier ;
                                crm:P2_has_type <http://www.lynx.com/resource/cultural-heritage-object/identifier/general-id> ;
                                rdfs:label ?label .
                    BIND("Object" AS ?typelabel)
                  } UNION {
                    # Archaeological Documents / Excavation Cards (E31_Document)
                    ?resource a crm:E31_Document .
                    ?resource crm:P1_is_identified_by/rdfs:label ?label .
                    BIND("Document/Card" AS ?typelabel)
                  } UNION {
                    # People / Actors (E21_Person or E39_Actor)
                    ?resource a crm:E21_Person .
                    OPTIONAL { ?resource crm:P1_is_identified_by/rdfs:label ?personLabel . }
                    OPTIONAL { ?resource rdfs:label ?rdfsLabel . }
                    BIND(COALESCE(?personLabel, ?rdfsLabel) AS ?label)
                    BIND("Person" AS ?typelabel)
                  } UNION {
                    # Places & Sites (E53_Place)
                    ?resource a crm:E53_Place ;
                              crm:P2_has_type <http://www.lynx.com/resource/cultural-heritage-place/place> ;
                              crm:P1_is_identified_by/rdfs:label ?label .
                    BIND("Place" AS ?typelabel)
                  } UNION {
                    ?resource a crm:E53_Place ;
                              crm:P2_has_type <http://www.lynx.com/resource/cultural-heritage-place/site> ;
                              crm:P1_is_identified_by/rdfs:label ?label .
                    BIND("Site" AS ?typelabel)
                  } UNION {
                    # Object Types (E55_Type)
                    ?resource a crm:E55_Type ;
                              crm:P2_has_type <http://www.lynx.com/resource/classification> ;
                              rdfs:label ?label .
                    BIND("Object Type" AS ?typelabel)
                  }
                  
                  FILTER REGEX(?label, ?__token__, "i")
                } 
                LIMIT 10'
              template='<span style="color: blue;" title="{{resource.value}}">{{label.value}} <em style="color: #666;">({{typelabel.value}})</em></span>'
              input-placeholder='Search across objects, documents, cards, people, sites, types...'
            >
            </semantic-simple-search>
        </div>
    </bs-col>
</div>

<!-- PANEL 1: ARCHAEOLOGICAL DOCUMENTS & CARDS -->
<div class="bso-component separator panel">
    <bs-row>
        <bs-col md="2">
            <h3>Documents & Cards</h3>
            <semantic-query
                query="PREFIX crm: <http://www.cidoc-crm.org/cidoc-crm/>
                       SELECT (COUNT(DISTINCT ?doc) as ?num) WHERE {
                         ?doc a crm:E31_Document .
                       }"
                template="{{#each bindings}}Found {{num.value}} documents & cards{{/each}}"
            ></semantic-query>
            <div class="bottom">
                <semantic-link iri="http://www.lynx.com/resource/structuredSearchDocument">
                    See all documents
                </semantic-link>
            </div>
        </bs-col>
        <bs-col md="10" class="bso-component card-container horizontal-scroll">
            <semantic-query
                query="PREFIX crm: <http://www.cidoc-crm.org/cidoc-crm/>
                       PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
                       
                       SELECT DISTINCT ?doc ?label WHERE {
                           ?doc a crm:E31_Document ;
                                crm:P1_is_identified_by ?appellation .
                           ?appellation rdfs:label ?label .
                       } LIMIT 10"
                template="{{#each bindings}}<div class='card' style='display: inline-block; margin: 10px; width: 200px; height: 120px; border: 1px solid #ddd; padding: 15px; border-radius: 4px; vertical-align: top; overflow: hidden;'><div class='card-body' style='height: 100%; display: flex; align-items: center; justify-content: center;'><h5 style='margin: 0; text-align: center; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;'><semantic-link iri='{{doc.value}}'>{{label.value}}</semantic-link></h5></div></div>{{/each}}"
            ></semantic-query>
        </bs-col>
    </bs-row>
</div>

<!-- PANEL 2: PEOPLE & ACTORS -->
<div class="bso-component separator panel">
    <bs-row>
        <bs-col md="2">
            <h3>People</h3>
            <semantic-query
                query="PREFIX crm: <http://www.cidoc-crm.org/cidoc-crm/>
                       SELECT (COUNT(DISTINCT ?person) as ?num) WHERE {
                         ?person a crm:E21_Person .
                       }"
                template="{{#each bindings}}Found {{num.value}} people{{/each}}"
            ></semantic-query>
            <div class="bottom">
                <semantic-link iri="http://www.lynx.com/resource/structuredSearchPerson">
                    See all people
                </semantic-link>
            </div>
        </bs-col>
        <bs-col md="10" class="bso-component card-container horizontal-scroll">
            <semantic-query
                query="PREFIX crm: <http://www.cidoc-crm.org/cidoc-crm/>
                       PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
                       
                       SELECT DISTINCT ?person ?label WHERE {
                           ?person a crm:E21_Person .
                           OPTIONAL { ?person crm:P1_is_identified_by/rdfs:label ?pLabel . }
                           OPTIONAL { ?person rdfs:label ?rLabel . }
                           BIND(COALESCE(?pLabel, ?rLabel, 'Unnamed Person') AS ?label)
                       } LIMIT 10"
                template="{{#each bindings}}<div class='card' style='display: inline-block; margin: 10px; width: 200px; height: 120px; border: 1px solid #ddd; padding: 15px; border-radius: 4px; vertical-align: top; overflow: hidden;'><div class='card-body' style='height: 100%; display: flex; align-items: center; justify-content: center;'><h5 style='margin: 0; text-align: center; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;'><semantic-link iri='{{person.value}}'>{{label.value}}</semantic-link></h5></div></div>{{/each}}"
            ></semantic-query>
        </bs-col>
    </bs-row>
</div>
