name: Deploy app to ResearchSpace platform

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync app files to local ResearchSpace app volume
        shell: powershell
        run: |
          $target = "${{ secrets.DEPLOY_APP_PATH }}"
          if ([string]::IsNullOrWhiteSpace($target)) {
            Write-Error "DEPLOY_APP_PATH is not configured"
            exit 1
          }
          if (!(Test-Path $target)) {
            New-Item -ItemType Directory -Path $target -Force | Out-Null
          }

          robocopy "$env:GITHUB_WORKSPACE" $target /E /XD "$env:GITHUB_WORKSPACE\.git" "$env:GITHUB_WORKSPACE\.github" /R:2 /W:5
          if ($LASTEXITCODE -gt 7) {
            Write-Error "Sync failed with robocopy exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }
          $global:LASTEXITCODE = 0

      - name: Restart ResearchSpace container
        shell: powershell
        run: |
          $container = "${{ secrets.DEPLOY_CONTAINER_NAME }}"
          if ([string]::IsNullOrWhiteSpace($container)) {
            Write-Error "DEPLOY_CONTAINER_NAME is not configured"
            exit 1
          }
          docker restart $container
