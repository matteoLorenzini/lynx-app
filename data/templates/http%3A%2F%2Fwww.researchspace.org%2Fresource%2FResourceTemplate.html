[[#if (urlParam "frame")]]
<style>
  .rs-application .page.page-local-overwrite {
    padding-top: 0;
  }
</style>
<div class="page page-local-overwrite">
    [[> rsp:ResourceContent]]
</div>

[[else]]
<ol class="page-breadcrumb">
  <li>
    <mp-link title="Home" url="/">Home</mp-link>
  </li>

  [[#block "activeBreadcrumb"]]
  <!-- BREADCRUMB 1: For Artifacts (E18_Physical_Thing) -->
  <semantic-query query='
    PREFIX crm: <http://www.cidoc-crm.org/cidoc-crm/>
    PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>

    SELECT DISTINCT ?site ?label WHERE {
      BIND(<[[this]]> AS ?subject)
      ?subject a crm:E18_Physical_Thing ;
               crm:P53_has_former_or_current_location ?site .
      ?site a crm:E53_Place ;
            crm:P2_has_type <http://www.lynx.com/resource/site-of-discovery> .
      OPTIONAL { ?site rdfs:label ?siteLabel }
      BIND(COALESCE(?siteLabel, STR(?site)) AS ?label)
    } LIMIT 1'
    template='{{> artifactCrumb}}'>
    <template id='artifactCrumb'>
      {{#each bindings}}
        <li><semantic-link iri="{{site.value}}">{{label.value}}</semantic-link></li>
      {{/each}}
    </template>
  </semantic-query>

  <!-- BREADCRUMB 2: For Stratigraphic Units (crmarchaeo:A2_Stratigraphic_Volume_Unit) -->
  <semantic-query query='
    PREFIX crm: <http://www.cidoc-crm.org/cidoc-crm/>
    PREFIX crmarchaeo: <http://www.cidoc-crm.org/extensions/crmarchaeo/>
    PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>

    SELECT DISTINCT ?site ?siteLabel ?area ?areaLabel WHERE {
      BIND(<[[this]]> AS ?subject)
      ?subject a crmarchaeo:A2_Stratigraphic_Volume_Unit ;
               crmarchaeo:AP5i_was_partially_or_totally_removed_by ?excavation .
      ?excavation crm:P7_took_place_at ?site .
      OPTIONAL { ?site rdfs:label ?siteLabel }
      OPTIONAL { 
        ?site crm:P89_falls_within ?area . 
        ?area a crm:E53_Place .
        OPTIONAL { ?area rdfs:label ?areaLabel }
      }
    } LIMIT 1'
    template='{{> usCrumb}}'>
    <template id='usCrumb'>
      {{#each bindings}}
        {{#if area}}
          <li><semantic-link iri="{{area.value}}">{{#if areaLabel}}{{areaLabel.value}}{{else}}Area{{/if}}</semantic-link></li>
        {{/if}}
        {{#if site}}
          <li><semantic-link iri="{{site.value}}">{{#if siteLabel}}{{siteLabel.value}}{{else}}Site{{/if}}</semantic-link></li>
        {{/if}}
      {{/each}}
    </template>
  </semantic-query>

  <!-- CURRENT RESOURCE LABEL -->
  <li class="active">
    <mp-label iri="[[this]]"></mp-label>
  </li>
  [[/block]]
</ol>

<div class="page">
  [[> rsp:ResourceContent]]
</div>
[[/if]]
